[project]
name = "seo-programmatic-agent"
version = "0.1.0"
description = "Agente de SEO programático sobre Google ADK, Gemini y MCP (Agent Registry)."
readme = "README.md"
authors = [
    { name = "NachoRob", email = "ignaciorob6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=4.1.0",
    # agent-identity y a2a son requeridos por google.adk.integrations.agent_registry
    "google-adk[agent-identity,a2a]>=2.12.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-cloud-firestore>=2.19",
    "google-genai>=2.30.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: llama a servicios reales de GCP (requiere --live y ADC válidas)",
    "real_masking: usa el enmascaramiento real de P1-18 en el pipeline",
]
filterwarnings = [
    "ignore::UserWarning:google.adk.*",
]
